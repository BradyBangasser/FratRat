[package]
name = "ghost-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
ghost-ios = { path = "../ios" }
libghost = { git = "https://github.com/BradyBangasser/zkrp", tag = "v0.4.1" }
zkcred = { git = "https://github.com/BradyBangasser/zkrp", tag = "v0.4.1" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "time", "sync"] }
