[package]
name = "ghost-ios"
version = "0.1.0"
edition = "2024"

[lib]
name = "ghost_ios"
# lib: the terminal client (../cli) runs on this same core.
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
libp2p = { version = "0.56", features = [
  "ed25519",
  "noise",
  "yamux",
  "tcp",
  "quic",
  "kad",
  "relay",
  "dns",
  "gossipsub",
] }
libghost = { git = "https://github.com/BradyBangasser/zkrp", tag = "v0.4.1" }
uniffi = { version = "0.31.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
thiserror = "2.0.18"
prost = "0.14.3"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
tonic = "0.14"
tonic-prost = "0.14"
tokio-stream = "0.1.18"
hex = "0.4"
chacha20poly1305 = "0.10"
hmac = "0.13.0"
sha2 = "0.11"

[dev-dependencies]
zkcred = { git = "https://github.com/BradyBangasser/zkrp", tag = "v0.4.1" }
